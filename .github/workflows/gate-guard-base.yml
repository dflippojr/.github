name: Gate guard (base branch)

# Demo head for dflippojr/.github#17: this version drops the guard. Under
# pull_request_target GitHub ignores it and runs the base branch's version.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - run: echo "guard skipped"
