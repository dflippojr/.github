name: Gate guard (default branch)

# This repository's own caller of gate-guard-target.yml. Under
# pull_request_target both this file and the local reusable workflow come from
# the default branch, and github.sha is the default branch's newest commit, so
# the guard script is the default branch's version too. Other repositories copy
# templates/gate-guard-target-caller.yml instead.
on:
  pull_request_target:
    # edited re-judges a pull request moved to another base, where the same
    # head can bring new hits; labeled/unlabeled re-judge it when an owner
    # label changes; closed re-judges the pull requests still open with the
    # head, so one that closes stops deciding their shared check.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

# The verdict is a check on the head commit, which several pull requests can
# share, so each run judges every open pull request with that head and runs
# alone for it: the newest decision for a commit is the one that lands.
concurrency:
  group: gate-guard-target-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

# The job id names the required check: gate-guard-target / gate-guard.
jobs:
  gate-guard-target:
    uses: ./.github/workflows/gate-guard-target.yml
    with:
      guard-ref: ${{ github.sha }}
