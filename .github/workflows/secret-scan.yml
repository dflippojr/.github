name: Secret scan

on:
  workflow_call:
    inputs:
      scanner-ref:
        description: Full commit SHA of dflippojr/.github, matching the caller's uses pin.
        type: string
        required: true
      runs-on:
        description: Runner labels as JSON. Use a disposable runner for untrusted PRs.
        type: string
        default: '"ubuntu-latest"'
      financial:
        description: Also scan every test/fixture file at the PR head for financial data.
        type: boolean
        default: false
    secrets:
      SECRET_SCAN_DENYLIST_SHA256:
        description: Whitespace-separated lowercase SHA-256 hashes of normalized private identifiers.
        required: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - name: Validate scanner pin and event
        env:
          SCANNER_REF: ${{ inputs.scanner-ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$SCANNER_REF" =~ ^[0-9a-f]{40}$ ]] && [[ "$EVENT_NAME" == pull_request ]]

      - name: Check out trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dflippojr/.github
          ref: ${{ inputs.scanner-ref }}
          path: scanner
          persist-credentials: false
          sparse-checkout: scripts/secret_scan.py
          sparse-checkout-cone-mode: false

      - name: Check out pinned gitleaks source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gitleaks/gitleaks
          ref: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
          path: gitleaks-source
          persist-credentials: false

      - name: Build pinned gitleaks
        working-directory: gitleaks-source
        env:
          GOMAXPROCS: '4'
        run: go build -p 4 -o "$RUNNER_TEMP/gitleaks" .

      - name: Scan PR commit range
        env:
          SECRET_SCAN_DENYLIST_SHA256: ${{ secrets.SECRET_SCAN_DENYLIST_SHA256 }}
          GITHUB_TOKEN: ${{ github.token }}
          FINANCIAL: ${{ inputs.financial }}
        run: |
          args=()
          if [[ "$FINANCIAL" == true ]]; then args+=(--financial); fi
          python3 scanner/scripts/secret_scan.py --github-event --gitleaks "$RUNNER_TEMP/gitleaks" "${args[@]}"
