# Copy to .github/workflows/secret-scan.yml. Replace BOTH <full-sha> values
# with the same reviewed dflippojr/.github commit SHA.
name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: dflippojr/.github/.github/workflows/secret-scan.yml@<full-sha>
    with:
      scanner-ref: <full-sha>
      # Enable in financial-planner:
      # financial: true
    secrets:
      SECRET_SCAN_DENYLIST_SHA256: ${{ secrets.SECRET_SCAN_DENYLIST_SHA256 }}
